<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b14">
<title>Biblioteca de planchas · Resp∴ Log∴ José Hernández N° 75</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .wrap { max-width:960px; margin:0 auto; padding:32px 20px 80px; }
  .topbar {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom:24px; flex-wrap:wrap;
  }
  .topbar .left { display:flex; flex-direction:column; gap:2px; }
  .topbar-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .topbar-actions button { width:auto; }

  .acciones-top { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .acciones-top button { width:auto; }

  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:flex-end; }
  .toolbar .campo { flex:1 1 180px; }
  .toolbar .campo.chico { flex:0 1 150px; }
  .toolbar .campo label { margin-bottom:5px; }

  .campo { margin-bottom:16px; }
  .campo.chico { margin-bottom:0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
  @media (max-width:640px) { .grid2, .grid3 { grid-template-columns:1fr; } }

  .card-header {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:18px 18px 0;
  }
  .card-header h2 { font-size:1.05rem; margin:0; }
  .card { margin-bottom:22px; }

  .empty-state { text-align:center; padding:32px 16px; color:var(--muted); font-size:.9rem; }

  .form-plancha {
    display:none; margin-top:4px; margin-bottom:22px; padding:18px;
    background:var(--green-2); border:1px solid var(--line); border-radius:8px;
  }
  .form-plancha.abierto { display:block; }
  .form-plancha .botones { display:flex; gap:8px; justify-content:flex-end; }
  .form-plancha .botones button { width:auto; }
  .form-plancha h3 { margin:0 0 14px; font-size:1.05rem; }

  .plancha-row {
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    padding:16px; border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .plancha-row:last-child { border-bottom:none; }
  .plancha-info { min-width:0; flex:1 1 260px; }
  .plancha-titulo { font-size:1rem; color:var(--cream); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .plancha-meta { color:var(--muted); font-size:.82rem; margin-top:3px; }
  .plancha-acciones { display:flex; gap:6px; flex-wrap:wrap; align-items:flex-start; }
  .plancha-acciones button { width:auto; padding:7px 12px; font-size:.78rem; }

  .pill {
    display:inline-block; font-size:.7rem; letter-spacing:.03em; padding:3px 10px;
    border-radius:20px; border:1px solid var(--line); white-space:nowrap;
  }
  .pill.escaneada { color:var(--muted); }
  .pill.generada { color:var(--gold-soft); border-color:var(--gold); background:rgba(201,168,93,.12); }

  .modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(3,17,12,.82);
    z-index:300; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.abierto { display:flex; }
  .modal-pdf-card {
    background:var(--green-1); border:1px solid var(--line); border-radius:10px;
    width:100%; max-width:900px; height:88vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-pdf-header {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .modal-pdf-titulo { font-size:.95rem; color:var(--cream); }
  .modal-pdf-acciones { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .modal-pdf-acciones a {
    text-decoration:none; display:inline-flex; align-items:center;
    padding:7px 12px; font-size:.78rem; border-radius:6px;
    border:1px solid var(--line); color:var(--muted); transition:.2s;
  }
  .modal-pdf-acciones a:hover { border-color:var(--gold); color:var(--gold-soft); }
  .modal-pdf-acciones button { width:auto; }
  .modal-pdf-acciones button:disabled { opacity:.4; cursor:default; }
  .modal-pdf-pagina { font-size:.8rem; color:var(--muted); white-space:nowrap; padding:0 2px; }

  .modal-pdf-body {
    flex:1; overflow:auto; background:#525659;
    display:flex; flex-direction:column; align-items:center; padding:18px 0;
  }
  .modal-pdf-body canvas { display:block; box-shadow:0 4px 18px rgba(0,0,0,.4); background:#fff; }
  .modal-pdf-estado {
    display:none; flex:1; width:100%; align-items:center; justify-content:center;
    text-align:center; padding:24px; color:var(--muted); font-size:.88rem;
  }
  .modal-pdf-estado.visible { display:flex; }

  .modal-chica-card {
    background:var(--green-1); border:1px solid var(--line); border-radius:10px;
    width:100%; max-width:340px; padding:22px;
  }
  .modal-chica-card h3 { margin:0 0 14px; font-size:1rem; }
  .modal-chica-card .botones { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .modal-chica-card .botones button { width:auto; }
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <div class="left">
      <div class="kicker">Resp∴ Log∴ José Hernández N° 75</div>
      <h1 style="font-size:1.6rem; margin:4px 0 0;">Biblioteca de planchas</h1>
      <p class="muted" style="margin:2px 0 0;">Planchas presentadas en tenida — leer, archivar y escribir</p>
    </div>
    <div class="topbar-actions">
      <button class="ghost" id="btn-panel">← Panel</button>
      <button class="ghost" id="btn-salir">Cerrar sesión</button>
    </div>
  </div>

  <div id="vista-cargando" class="muted">Cargando…</div>

  <div id="vista-principal" style="display:none;">

    <div class="acciones-top">
      <button class="primary" id="btn-escribir" style="width:auto;">✎ Escribir plancha</button>
      <button class="ghost" id="btn-subir-escaneada" style="display:none;">+ Subir plancha escaneada</button>
    </div>

    <!-- ===================== ALTA / EDICIÓN escaneada (solo Secretario) ===================== -->
    <div class="form-plancha" id="form-escaneada">
      <h3 id="form-escaneada-titulo">Subir plancha escaneada</h3>
      <form id="form-datos-escaneada">
        <div class="campo">
          <label for="e-titulo">Título</label>
          <input id="e-titulo" type="text" placeholder="Título de la plancha">
        </div>
        <div class="grid3">
          <div class="campo chico">
            <label for="e-autor">Autor</label>
            <select id="e-autor"></select>
          </div>
          <div class="campo chico">
            <label for="e-grado">Grado en que se leyó</label>
            <select id="e-grado"></select>
          </div>
          <div class="campo chico">
            <label for="e-fecha">Fecha de lectura</label>
            <input id="e-fecha" type="date">
          </div>
        </div>
        <div class="campo" style="margin-bottom:8px;">
          <label for="e-archivo" id="e-archivo-label">Archivo (PDF)</label>
          <input id="e-archivo" type="file" accept="application/pdf,.pdf">
          <p class="muted" id="e-archivo-actual" style="font-size:.76rem; margin-top:6px;"></p>
        </div>
        <span class="error-msg" id="escaneada-error"></span>
        <div class="botones">
          <button type="button" class="ghost" id="btn-cancelar-escaneada">Cancelar</button>
          <button type="submit" class="primary" id="btn-guardar-escaneada">Guardar</button>
        </div>
      </form>
    </div>

    <!-- ===================== EN REDACCIÓN (borradores) ===================== -->
    <div class="card" id="card-borradores" style="display:none;">
      <div class="card-header"><h2>En redacción</h2></div>
      <div id="borradores-contenido"></div>
    </div>

    <!-- ===================== BIBLIOTECA (leídas) ===================== -->
    <div class="toolbar">
      <div class="campo">
        <label for="buscador">Buscar</label>
        <input id="buscador" type="text" placeholder="Título, autor o contenido…">
      </div>
      <div class="campo chico">
        <label for="filtro-autor">Autor</label>
        <select id="filtro-autor"><option value="">Todos</option></select>
      </div>
      <div class="campo chico">
        <label for="filtro-grado">Grado</label>
        <select id="filtro-grado"><option value="">Todos</option></select>
      </div>
      <div class="campo chico">
        <label for="filtro-anio">Año</label>
        <select id="filtro-anio"><option value="">Todos</option></select>
      </div>
    </div>

    <div class="card" id="lista-card">
      <div class="card-header">
        <h2>Planchas leídas</h2>
      </div>
      <div id="lista-contenido"></div>
    </div>

  </div>
</div>

<!-- ===================== VISOR DE PDF ===================== -->
<div class="modal-overlay" id="modal-pdf">
  <div class="modal-pdf-card">
    <div class="modal-pdf-header">
      <div class="modal-pdf-titulo" id="modal-pdf-titulo">Plancha</div>
      <div class="modal-pdf-acciones">
        <button type="button" class="ghost" id="btn-pagina-ant" title="Página anterior">‹</button>
        <span class="modal-pdf-pagina" id="modal-pdf-pagina"></span>
        <button type="button" class="ghost" id="btn-pagina-sig" title="Página siguiente">›</button>
        <a href="#" target="_blank" rel="noopener" id="link-abrir-pestana">Abrir en pestaña nueva</a>
        <button type="button" class="ghost" id="btn-cerrar-visor">Cerrar ✕</button>
      </div>
    </div>
    <div class="modal-pdf-body" id="modal-pdf-body">
      <canvas id="pdf-canvas" style="display:none;"></canvas>
      <div class="modal-pdf-estado" id="pdf-estado">Cargando…</div>
    </div>
  </div>
</div>

<!-- ===================== MARCAR LEÍDA EN TENIDA ===================== -->
<div class="modal-overlay" id="modal-marcar-leida">
  <div class="modal-chica-card">
    <h3>Marcar leída en tenida</h3>
    <div class="campo">
      <label for="ml-fecha">Fecha en que se leyó</label>
      <input id="ml-fecha" type="date">
    </div>
    <span class="error-msg" id="ml-error"></span>
    <div class="botones">
      <button type="button" class="ghost" id="btn-ml-cancelar">Cancelar</button>
      <button type="button" class="primary" id="btn-ml-confirmar" style="width:auto;">Confirmar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../shared/supabase-client.js"></script>
<script type="module">
// Mismo criterio que Boletines: PDF.js renderizando en <canvas>, porque
// Chrome Android no muestra bien un PDF embebido en <iframe>.
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.min.mjs";

// ============================================================
// Estado en memoria
// ============================================================
const BUCKET_PLANCHAS = "planchas";

let sesion = null;
let esSecretario = false;
let miHermanoId = null;
let gradosData = [];        // [{id, nombre, orden, ...}]
let hermanosData = [];      // [{id, nombre_completo, activo}]
let planchasCache = [];     // todas las visibles por RLS (leídas + borradores propios/todos)
let editandoEscaneadaId = null;
let targetMarcarLeida = null;

// ---- estado del visor de PDF ----
let pdfDocActual = null;
let paginaPdfActual = 1;
let totalPaginasPdf = 0;
let renderEnCurso = false;
let renderPendiente = null;

const $ = (id) => document.getElementById(id);

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function toast(msg, esError) {
  const el = document.createElement("div");
  el.className = "toast" + (esError ? " err" : "");
  el.style.cssText = "position:fixed;bottom:22px;left:50%;transform:translateX(-50%);"
    + "background:var(--green-3);color:var(--cream);border:1px solid " + (esError ? "var(--danger)" : "var(--gold)") + ";"
    + "padding:10px 20px;border-radius:20px;font-size:.85rem;z-index:200;box-shadow:0 6px 24px rgba(0,0,0,.4);";
  if (esError) el.style.color = "var(--danger)";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function mostrarVista(id) {
  ["vista-cargando", "vista-principal"].forEach((v) => {
    $(v).style.display = v === id ? "block" : "none";
  });
}

function nombreHermano(id) {
  return hermanosData.find((h) => h.id === id)?.nombre_completo || "—";
}
function nombreGrado(id) {
  return gradosData.find((g) => g.id === id)?.nombre || "—";
}
function fmtFechaCorta(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function fmtFechaHora(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("es-AR") + " " + d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
}

// ============================================================
// Arranque
// ============================================================
(async () => {
  sesion = await exigirSesion();
  if (!sesion) return;

  const [
    { data: soySec, error: errSec },
    { data: hermanoPropio },
    { data: gd, error: errGrados },
    { data: herm, error: errHerm },
  ] = await Promise.all([
    db.rpc("soy_secretario"),
    db.from("hermanos").select("id").eq("auth_user_id", sesion.user.id).maybeSingle(),
    db.from("grados").select("*").order("orden"),
    db.from("hermanos").select("id, nombre_completo, activo").order("nombre_completo"),
  ]);

  if (errSec) console.error("soy_secretario()", errSec);
  if (errGrados) console.error("grados", errGrados);
  if (errHerm) console.error("hermanos", errHerm);

  esSecretario = !!soySec;
  miHermanoId = hermanoPropio?.id || null;
  gradosData = gd || [];
  hermanosData = herm || [];

  $("btn-subir-escaneada").style.display = esSecretario ? "inline-flex" : "none";
  poblarSelectGradosFormulario();
  poblarSelectAutorFormulario();
  poblarSelectGradoFiltro();

  await cargarListado();
  mostrarVista("vista-principal");
})();

$("btn-panel").addEventListener("click", () => window.location.href = "../panel.html");
$("btn-salir").addEventListener("click", async () => {
  await db.auth.signOut();
  window.location.href = "../index.html";
});

$("btn-escribir").addEventListener("click", () => {
  window.open("redactar.html", "_blank");
});

// ============================================================
// LISTADO
// ============================================================
async function cargarListado() {
  const { data, error } = await db
    .from("planchas")
    .select("*")
    .order("fecha_lectura", { ascending: false, nullsFirst: false })
    .order("actualizado_en", { ascending: false });

  if (error) { toast("No se pudo cargar la biblioteca.", true); console.error(error); return; }

  planchasCache = data || [];
  poblarSelectAutorFiltro();
  poblarSelectAnios();
  renderBorradores();
  renderListado();
}

function poblarSelectGradosFormulario() {
  const opciones = gradosData.map((g) => `<option value="${g.id}">${esc(g.nombre)}</option>`).join("");
  $("e-grado").innerHTML = opciones;
}
function poblarSelectAutorFormulario() {
  const activos = hermanosData.filter((h) => h.activo);
  $("e-autor").innerHTML = '<option value="">Elegir…</option>'
    + activos.map((h) => `<option value="${h.id}">${esc(h.nombre_completo)}</option>`).join("");
}
function poblarSelectGradoFiltro() {
  $("filtro-grado").innerHTML = '<option value="">Todos</option>'
    + gradosData.map((g) => `<option value="${g.id}">${esc(g.nombre)}</option>`).join("");
}
function poblarSelectAutorFiltro() {
  const autorActual = $("filtro-autor").value;
  const leidas = planchasCache.filter((p) => p.estado === "leida");
  const idsAutores = [...new Set(leidas.map((p) => p.autor_id))];
  const opciones = idsAutores
    .map((id) => ({ id, nombre: nombreHermano(id) }))
    .sort((a, b) => a.nombre.localeCompare(b.nombre));
  $("filtro-autor").innerHTML = '<option value="">Todos</option>'
    + opciones.map((o) => `<option value="${o.id}">${esc(o.nombre)}</option>`).join("");
  if (idsAutores.includes(autorActual)) $("filtro-autor").value = autorActual;
}
function poblarSelectAnios() {
  const anioActual = $("filtro-anio").value;
  const leidas = planchasCache.filter((p) => p.estado === "leida" && p.fecha_lectura);
  const anios = [...new Set(leidas.map((p) => p.fecha_lectura.slice(0, 4)))].sort((a, b) => b - a);
  $("filtro-anio").innerHTML = '<option value="">Todos</option>'
    + anios.map((a) => `<option value="${a}">${a}</option>`).join("");
  if (anios.includes(anioActual)) $("filtro-anio").value = anioActual;
}

// ---- En redacción ----
function renderBorradores() {
  const borradores = planchasCache.filter((p) => p.estado === "borrador");
  const card = $("card-borradores");

  if (borradores.length === 0) { card.style.display = "none"; return; }
  card.style.display = "block";

  $("borradores-contenido").innerHTML = borradores.map((p) => `
    <div class="plancha-row" data-id="${p.id}">
      <div class="plancha-info">
        <div class="plancha-titulo">
          <span>${esc(p.titulo || "Sin título")}</span>
          <span class="pill generada">Borrador</span>
        </div>
        <div class="plancha-meta">
          ${esSecretario ? esc(nombreHermano(p.autor_id)) + " — " : ""}${esc(nombreGrado(p.grado_id))}
          — última edición ${fmtFechaHora(p.actualizado_en)}
        </div>
      </div>
      <div class="plancha-acciones">
        <button type="button" class="ghost btn-continuar" data-id="${p.id}">Continuar redactando</button>
        ${esSecretario ? `<button type="button" class="ghost btn-marcar-leida" data-id="${p.id}">Marcar leída en tenida</button>` : ""}
        ${(esSecretario || p.autor_id === miHermanoId) ? `<button type="button" class="ghost btn-borrar" data-id="${p.id}" style="color:var(--danger); border-color:var(--danger);">Borrar</button>` : ""}
      </div>
    </div>
  `).join("");

  $("borradores-contenido").querySelectorAll(".btn-continuar").forEach((btn) => {
    btn.addEventListener("click", () => window.open(`redactar.html?id=${btn.dataset.id}`, "_blank"));
  });
  $("borradores-contenido").querySelectorAll(".btn-marcar-leida").forEach((btn) => {
    btn.addEventListener("click", () => abrirModalMarcarLeida(btn.dataset.id));
  });
  $("borradores-contenido").querySelectorAll(".btn-borrar").forEach((btn) => {
    btn.addEventListener("click", () => borrarPlancha(btn.dataset.id));
  });
}

// ---- Biblioteca (leídas) ----
function renderListado() {
  const texto = $("buscador").value.trim().toLowerCase();
  const autorFiltro = $("filtro-autor").value;
  const gradoFiltro = $("filtro-grado").value;
  const anioFiltro = $("filtro-anio").value;

  const leidas = planchasCache.filter((p) => p.estado === "leida");

  const filtradas = leidas.filter((p) => {
    if (autorFiltro && String(p.autor_id) !== autorFiltro) return false;
    if (gradoFiltro && String(p.grado_id) !== gradoFiltro) return false;
    if (anioFiltro && (!p.fecha_lectura || !p.fecha_lectura.startsWith(anioFiltro))) return false;
    if (texto) {
      const enTitulo = (p.titulo || "").toLowerCase().includes(texto);
      const enAutor = nombreHermano(p.autor_id).toLowerCase().includes(texto);
      const enContenido = (p.contenido_texto || "").toLowerCase().includes(texto);
      if (!enTitulo && !enAutor && !enContenido) return false;
    }
    return true;
  });

  const cont = $("lista-contenido");

  if (filtradas.length === 0) {
    cont.innerHTML = leidas.length === 0
      ? '<div class="empty-state">Todavía no hay planchas leídas archivadas.</div>'
      : '<div class="empty-state">No hay planchas que coincidan con la búsqueda.</div>';
    return;
  }

  cont.innerHTML = filtradas.map((p) => `
    <div class="plancha-row" data-id="${p.id}">
      <div class="plancha-info">
        <div class="plancha-titulo">
          <span>${esc(p.titulo || "Sin título")}</span>
          <span class="pill ${p.tipo}">${p.tipo === "escaneada" ? "Escaneada" : "Redactada"}</span>
        </div>
        <div class="plancha-meta">
          ${esc(nombreHermano(p.autor_id))} — ${esc(nombreGrado(p.grado_id))} — ${fmtFechaCorta(p.fecha_lectura)}
        </div>
      </div>
      <div class="plancha-acciones">
        ${p.archivo_url ? `<button type="button" class="ghost btn-ver" data-id="${p.id}">Ver</button>` : '<span class="muted" style="font-size:.78rem;">Sin PDF</span>'}
        ${esSecretario ? `<button type="button" class="ghost btn-editar" data-id="${p.id}">Editar</button>` : ""}
        ${(esSecretario && p.tipo === "generada") ? `<button type="button" class="ghost btn-revertir" data-id="${p.id}">Revertir a borrador</button>` : ""}
        ${esSecretario ? `<button type="button" class="ghost btn-borrar" data-id="${p.id}" style="color:var(--danger); border-color:var(--danger);">Borrar</button>` : ""}
      </div>
    </div>
  `).join("");

  cont.querySelectorAll(".btn-ver").forEach((btn) => {
    btn.addEventListener("click", () => verPlancha(btn.dataset.id));
  });
  cont.querySelectorAll(".btn-editar").forEach((btn) => {
    btn.addEventListener("click", () => editarPlancha(btn.dataset.id));
  });
  cont.querySelectorAll(".btn-revertir").forEach((btn) => {
    btn.addEventListener("click", () => revertirABorrador(btn.dataset.id));
  });
  cont.querySelectorAll(".btn-borrar").forEach((btn) => {
    btn.addEventListener("click", () => borrarPlancha(btn.dataset.id));
  });
}

$("buscador").addEventListener("input", renderListado);
$("filtro-autor").addEventListener("change", renderListado);
$("filtro-grado").addEventListener("change", renderListado);
$("filtro-anio").addEventListener("change", renderListado);

function editarPlancha(id) {
  const p = planchasCache.find((x) => String(x.id) === String(id));
  if (!p) return;
  if (p.tipo === "generada") {
    window.open(`redactar.html?id=${id}`, "_blank");
  } else {
    abrirFormEdicionEscaneada(id);
  }
}

async function revertirABorrador(id) {
  if (!confirm("¿Volver esta plancha a borrador? Deja de verse en la biblioteca pública hasta que se vuelva a marcar como leída.")) return;
  const { error } = await db.from("planchas").update({ estado: "borrador" }).eq("id", id);
  if (error) { toast("No se pudo revertir.", true); console.error(error); return; }
  toast("Plancha vuelta a borrador.");
  await cargarListado();
}

async function borrarPlancha(id) {
  const p = planchasCache.find((x) => String(x.id) === String(id));
  if (!p) return;
  if (!confirm("¿Borrar esta plancha? No se puede deshacer.")) return;

  const { error } = await db.from("planchas").delete().eq("id", id);
  if (error) { toast("No se pudo borrar.", true); console.error(error); return; }

  if (p.archivo_url) db.storage.from(BUCKET_PLANCHAS).remove([p.archivo_url]).catch(() => {});

  await cargarListado();
  toast("Plancha borrada.");
}

// ============================================================
// MARCAR LEÍDA EN TENIDA
// ============================================================
function abrirModalMarcarLeida(id) {
  targetMarcarLeida = id;
  $("ml-error").textContent = "";
  $("ml-fecha").value = new Date().toISOString().slice(0, 10);
  $("modal-marcar-leida").classList.add("abierto");
}
$("btn-ml-cancelar").addEventListener("click", () => {
  $("modal-marcar-leida").classList.remove("abierto");
  targetMarcarLeida = null;
});
$("btn-ml-confirmar").addEventListener("click", async () => {
  const fecha = $("ml-fecha").value;
  if (!fecha) { $("ml-error").textContent = "Falta la fecha."; return; }

  const { error } = await db.from("planchas").update({ estado: "leida", fecha_lectura: fecha }).eq("id", targetMarcarLeida);
  if (error) { $("ml-error").textContent = "No se pudo marcar como leída."; console.error(error); return; }

  $("modal-marcar-leida").classList.remove("abierto");
  targetMarcarLeida = null;
  toast("Plancha marcada como leída en tenida.");
  await cargarListado();
});
$("modal-marcar-leida").addEventListener("click", (e) => {
  if (e.target.id === "modal-marcar-leida") {
    $("modal-marcar-leida").classList.remove("abierto");
    targetMarcarLeida = null;
  }
});

// ============================================================
// ALTA / EDICIÓN escaneada (solo Secretario)
// ============================================================
$("btn-subir-escaneada").addEventListener("click", () => abrirFormAltaEscaneada());

function abrirFormAltaEscaneada() {
  editandoEscaneadaId = null;
  $("form-escaneada-titulo").textContent = "Subir plancha escaneada";
  $("escaneada-error").textContent = "";
  $("e-titulo").value = "";
  $("e-autor").value = "";
  if (gradosData.length) $("e-grado").value = gradosData[0].id;
  $("e-fecha").value = new Date().toISOString().slice(0, 10);
  $("e-archivo").value = "";
  $("e-archivo-label").textContent = "Archivo (PDF)";
  $("e-archivo-actual").textContent = "";
  $("form-escaneada").classList.add("abierto");
  $("form-escaneada").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function abrirFormEdicionEscaneada(id) {
  const p = planchasCache.find((x) => String(x.id) === String(id));
  if (!p) return;
  editandoEscaneadaId = p.id;
  $("form-escaneada-titulo").textContent = "Editar plancha escaneada";
  $("escaneada-error").textContent = "";
  $("e-titulo").value = p.titulo || "";
  $("e-autor").value = p.autor_id || "";
  $("e-grado").value = p.grado_id || "";
  $("e-fecha").value = p.fecha_lectura || "";
  $("e-archivo").value = "";
  $("e-archivo-label").textContent = "Reemplazar archivo (opcional)";
  $("e-archivo-actual").textContent = p.archivo_url
    ? "Ya tiene un PDF cargado. Elegí uno nuevo solo si querés reemplazarlo."
    : "Todavía no tiene PDF cargado.";
  $("form-escaneada").classList.add("abierto");
  $("form-escaneada").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

$("btn-cancelar-escaneada").addEventListener("click", () => {
  $("form-escaneada").classList.remove("abierto");
  editandoEscaneadaId = null;
});

$("form-datos-escaneada").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("escaneada-error").textContent = "";

  const titulo = $("e-titulo").value.trim();
  const autorId = $("e-autor").value;
  const gradoId = Number($("e-grado").value);
  const fecha = $("e-fecha").value;
  const archivo = $("e-archivo").files[0] || null;

  if (!titulo) { $("escaneada-error").textContent = "Falta el título."; return; }
  if (!autorId) { $("escaneada-error").textContent = "Elegí el autor."; return; }
  if (!gradoId) { $("escaneada-error").textContent = "Elegí el grado."; return; }
  if (!fecha) { $("escaneada-error").textContent = "Falta la fecha de lectura."; return; }
  if (!editandoEscaneadaId && !archivo) { $("escaneada-error").textContent = "Elegí el archivo PDF."; return; }
  if (archivo) {
    const esPdf = archivo.type === "application/pdf" || /\.pdf$/i.test(archivo.name);
    if (!esPdf) { $("escaneada-error").textContent = "El archivo tiene que ser un PDF."; return; }
  }

  const btn = $("btn-guardar-escaneada");
  btn.disabled = true;
  btn.textContent = "Guardando…";

  try {
    let id = editandoEscaneadaId;

    if (!id) {
      const { data, error } = await db.from("planchas").insert({
        tipo: "escaneada",
        titulo,
        autor_id: autorId,
        grado_id: gradoId,
        estado: "leida",
        fecha_lectura: fecha,
        cargado_por: miHermanoId,
      }).select().single();
      if (error) throw error;
      id = data.id;
    } else {
      const { error } = await db.from("planchas").update({
        titulo, autor_id: autorId, grado_id: gradoId, fecha_lectura: fecha,
      }).eq("id", id);
      if (error) throw error;
    }

    if (archivo) {
      const path = `${id}/archivo.pdf`;
      const { error: errSubida } = await db.storage.from(BUCKET_PLANCHAS)
        .upload(path, archivo, { contentType: "application/pdf", upsert: true });
      if (errSubida) throw errSubida;

      const { error: errUpdate } = await db.from("planchas").update({ archivo_url: path }).eq("id", id);
      if (errUpdate) throw errUpdate;
    }

    toast(editandoEscaneadaId ? "Plancha actualizada." : "Plancha cargada.");
    $("form-escaneada").classList.remove("abierto");
    editandoEscaneadaId = null;
    await cargarListado();
  } catch (err) {
    console.error(err);
    $("escaneada-error").textContent = "No se pudo guardar la plancha.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Guardar";
  }
});

// ============================================================
// VISOR DE PDF (embebido, renderizado con PDF.js)
// ============================================================
function mostrarEstadoPdf(texto) {
  const estado = $("pdf-estado");
  if (texto) {
    estado.textContent = texto;
    estado.classList.add("visible");
    $("pdf-canvas").style.display = "none";
  } else {
    estado.classList.remove("visible");
    $("pdf-canvas").style.display = "block";
  }
}

function actualizarControlesPagina() {
  $("modal-pdf-pagina").textContent = totalPaginasPdf ? `${paginaPdfActual} / ${totalPaginasPdf}` : "";
  $("btn-pagina-ant").disabled = paginaPdfActual <= 1;
  $("btn-pagina-sig").disabled = paginaPdfActual >= totalPaginasPdf;
}

async function renderPaginaPdf(numeroPagina) {
  if (!pdfDocActual) return;
  if (renderEnCurso) { renderPendiente = numeroPagina; return; }
  renderEnCurso = true;

  try {
    const pagina = await pdfDocActual.getPage(numeroPagina);
    const contenedor = $("modal-pdf-body");
    const anchoDisponible = Math.max(contenedor.clientWidth - 32, 240);
    const viewportBase = pagina.getViewport({ scale: 1 });
    const escala = anchoDisponible / viewportBase.width;
    const dpr = window.devicePixelRatio || 1;
    const viewport = pagina.getViewport({ scale: escala * dpr });

    const canvas = $("pdf-canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = (viewport.width / dpr) + "px";
    canvas.style.height = (viewport.height / dpr) + "px";

    await pagina.render({ canvasContext: ctx, viewport }).promise;

    paginaPdfActual = numeroPagina;
    mostrarEstadoPdf(null);
    actualizarControlesPagina();
  } catch (err) {
    console.error(err);
    mostrarEstadoPdf("No se pudo mostrar esta página. Probá con \"Abrir en pestaña nueva\".");
  } finally {
    renderEnCurso = false;
    if (renderPendiente !== null) {
      const siguiente = renderPendiente;
      renderPendiente = null;
      renderPaginaPdf(siguiente);
    }
  }
}

async function verPlancha(id) {
  const p = planchasCache.find((x) => String(x.id) === String(id));
  if (!p || !p.archivo_url) return;

  const { data, error } = await db.storage.from(BUCKET_PLANCHAS).createSignedUrl(p.archivo_url, 600);
  if (error || !data) { toast("No se pudo generar el link para ver la plancha.", true); console.error(error); return; }

  const titulo = `${p.titulo || "Sin título"} — ${nombreGrado(p.grado_id)} — ${fmtFechaCorta(p.fecha_lectura)}`;
  $("modal-pdf-titulo").textContent = titulo;
  $("link-abrir-pestana").href = data.signedUrl;
  $("modal-pdf-pagina").textContent = "";
  $("modal-pdf").classList.add("abierto");
  mostrarEstadoPdf("Cargando…");

  try {
    pdfDocActual = await pdfjsLib.getDocument({ url: data.signedUrl }).promise;
    totalPaginasPdf = pdfDocActual.numPages;
    paginaPdfActual = 1;
    await renderPaginaPdf(1);
  } catch (err) {
    console.error(err);
    mostrarEstadoPdf("No se pudo mostrar la vista previa acá. Probá con \"Abrir en pestaña nueva\".");
  }
}

function cerrarVisor() {
  $("modal-pdf").classList.remove("abierto");
  if (pdfDocActual) {
    pdfDocActual.destroy();
    pdfDocActual = null;
  }
  totalPaginasPdf = 0;
  paginaPdfActual = 1;
  renderPendiente = null;
  const canvas = $("pdf-canvas");
  canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
}

$("btn-cerrar-visor").addEventListener("click", cerrarVisor);
$("btn-pagina-ant").addEventListener("click", () => {
  if (paginaPdfActual > 1) renderPaginaPdf(paginaPdfActual - 1);
});
$("btn-pagina-sig").addEventListener("click", () => {
  if (paginaPdfActual < totalPaginasPdf) renderPaginaPdf(paginaPdfActual + 1);
});
$("modal-pdf").addEventListener("click", (e) => {
  if (e.target.id === "modal-pdf") cerrarVisor();
});
document.addEventListener("keydown", (e) => {
  if ($("modal-pdf").classList.contains("abierto")) {
    if (e.key === "Escape") cerrarVisor();
    if (e.key === "ArrowLeft" && paginaPdfActual > 1) renderPaginaPdf(paginaPdfActual - 1);
    if (e.key === "ArrowRight" && paginaPdfActual < totalPaginasPdf) renderPaginaPdf(paginaPdfActual + 1);
  }
});
</script>
