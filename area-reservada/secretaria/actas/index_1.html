<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secretaría · Restirador · Resp∴ Log∴ José Hernández N° 75</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
  :root{
    --verde-osc:#1f3d2c;
    --verde:#2f6b46;
    --verde-cl:#e8f1ea;
    --dorado:#b8963d;
    --gris:#5b6360;
    --gris-cl:#f4f5f4;
    --borde:#d9ded9;
    --rojo:#a8442f;
    --blanco:#ffffff;
    --radio:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--gris-cl);
    color:#1c211d;
  }
  #app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--blanco);display:flex;flex-direction:column;}
  header.top{
    background:var(--verde-osc);color:var(--blanco);
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;
  }
  header.top h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px;}
  header.top .sub{font-size:11px;opacity:.75;margin-top:2px;}
  header.top button{
    background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--blanco);
    padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;
  }
  header.top button:hover{background:rgba(255,255,255,.12);}
  main{flex:1;padding:16px;padding-bottom:90px;}
  h2.section-title{font-size:15px;color:var(--verde-osc);margin:0 0 12px;border-bottom:2px solid var(--verde);padding-bottom:6px;}
  .card{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);padding:14px;margin-bottom:12px;}
  .card h3{margin:0 0 8px;font-size:14px;color:var(--verde-osc);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--gris);margin-bottom:4px;font-weight:600;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--borde);border-radius:8px;font-size:14px;font-family:inherit;background:var(--blanco);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  @media(max-width:520px){.row2,.row3{grid-template-columns:1fr;}}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--verde);color:var(--blanco);border:none;padding:10px 16px;
    border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .btn:hover{background:var(--verde-osc);}
  .btn.secondary{background:var(--blanco);color:var(--verde-osc);border:1px solid var(--verde);}
  .btn.secondary:hover{background:var(--verde-cl);}
  .btn.ghost{background:transparent;color:var(--gris);border:1px solid var(--borde);}
  .btn.danger{background:var(--blanco);color:var(--rojo);border:1px solid var(--rojo);}
  .btn.small{padding:6px 10px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .home-grid{display:grid;gap:12px;}
  .home-card{
    display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--borde);
    border-radius:var(--radio);cursor:pointer;background:var(--blanco);
  }
  .home-card:hover{border-color:var(--verde);background:var(--verde-cl);}
  .home-card .icon{width:38px;height:38px;border-radius:8px;background:var(--verde-cl);color:var(--verde-osc);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .home-card .txt strong{display:block;font-size:14px;color:#1c211d;}
  .home-card .txt span{font-size:12px;color:var(--gris);}
  .pill{display:inline-block;background:var(--verde-cl);color:var(--verde-osc);font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;}
  .stepper{display:flex;overflow-x:auto;gap:6px;padding:10px 16px;background:var(--gris-cl);border-bottom:1px solid var(--borde);position:sticky;top:57px;z-index:15;}
  .step-chip{
    flex-shrink:0;font-size:11px;padding:6px 10px;border-radius:16px;border:1px solid var(--borde);background:var(--blanco);
    cursor:pointer;white-space:nowrap;color:var(--gris);
  }
  .step-chip.active{background:var(--verde);color:var(--blanco);border-color:var(--verde);}
  .step-chip.done{border-color:var(--verde);color:var(--verde-osc);}
  .checklist-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--borde);}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--verde);}
  .checklist-item .lbl{flex:1;font-size:14px;}
  .checklist-item .lbl small{display:block;color:var(--gris);font-size:11px;}
  .order-btns{display:flex;gap:4px;}
  .order-btns button{background:none;border:1px solid var(--borde);border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--gris);}
  .repeat-block{border:1px dashed var(--borde);border-radius:8px;padding:10px;margin-bottom:10px;position:relative;background:var(--gris-cl);}
  .repeat-block .rm{position:absolute;top:6px;right:6px;background:none;border:none;color:var(--rojo);cursor:pointer;font-size:16px;}
  .chips-multi{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .chip-toggle{border:1px solid var(--borde);border-radius:16px;padding:5px 10px;font-size:12px;cursor:pointer;background:var(--blanco);color:var(--gris);}
  .chip-toggle.on{background:var(--verde);color:var(--blanco);border-color:var(--verde);}
  .chip-toggle.on.warn{background:var(--dorado);border-color:var(--dorado);}
  .chip-toggle.on.danger{background:var(--rojo);border-color:var(--rojo);}
  .asist-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--borde);}
  .asist-row:last-child{border-bottom:none;}
  .asist-row .nombre{flex:1 1 100%;font-size:14px;font-weight:600;}
  .toggle-group{display:flex;gap:6px;flex-wrap:wrap;}
  .toggle-btn{border:1px solid var(--borde);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;background:var(--blanco);color:var(--gris);}
  .toggle-btn.presente.on{background:var(--verde);color:#fff;border-color:var(--verde);}
  .toggle-btn.disculpado.on{background:var(--dorado);color:#fff;border-color:var(--dorado);}
  .toggle-btn.ausente.on{background:var(--rojo);color:#fff;border-color:var(--rojo);}
  .motivo-input{margin-top:6px;width:100%;padding:7px 9px;border:1px solid var(--borde);border-radius:6px;font-size:12.5px;}
  table.resumen{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.resumen th, table.resumen td{padding:8px 6px;border-bottom:1px solid var(--borde);text-align:left;}
  table.resumen th{color:var(--verde-osc);font-size:11px;text-transform:uppercase;letter-spacing:.3px;}
  table.resumen td.num{text-align:center;}
  .bar-wrap{background:var(--gris-cl);border-radius:6px;height:8px;overflow:hidden;margin-top:4px;}
  .bar-fill{height:100%;background:var(--verde);}
  .grid-wrap{overflow-x:auto;}
  table.grilla{border-collapse:collapse;font-size:11px;white-space:nowrap;}
  table.grilla th, table.grilla td{border:1px solid var(--borde);padding:6px 8px;text-align:center;}
  table.grilla th.hh-col{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;color:var(--verde-osc);}
  table.grilla td.fecha-col{text-align:left;font-weight:600;color:var(--verde-osc);white-space:nowrap;}
  table.grilla td.p{background:var(--verde-cl);color:var(--verde-osc);font-weight:700;}
  table.grilla td.d{background:#f6ecd7;color:var(--dorado);font-weight:700;}
  table.grilla td.a{background:#fbeae6;color:var(--rojo);font-weight:700;}
  .preview{
    white-space:pre-wrap;font-size:13.5px;line-height:1.7;background:var(--gris-cl);
    border:1px solid var(--borde);border-radius:8px;padding:16px;font-family:Georgia,serif;
  }
  .toolbar-bottom{
    position:sticky;bottom:0;background:var(--blanco);border-top:1px solid var(--borde);
    padding:10px 16px;display:flex;justify-content:space-between;gap:8px;
  }
  .muted{color:var(--gris);font-size:12px;}
  .badge-count{background:var(--dorado);color:var(--blanco);border-radius:10px;font-size:10px;padding:1px 6px;margin-left:6px;}
  .empty{text-align:center;padding:30px 10px;color:var(--gris);font-size:13px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--verde-osc);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:13px;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.2);
  }
  .taglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .tag{background:var(--verde-cl);color:var(--verde-osc);border-radius:14px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:6px;}
  .tag button{background:none;border:none;color:var(--verde-osc);cursor:pointer;font-size:13px;}
  .history-item{padding:12px;border:1px solid var(--borde);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;}
  .modal-overlay{position:fixed;inset:0;background:rgba(20,30,24,.55);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px;}
  .modal-card{background:#fff;border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3);}
  .sign-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .sign-tabs button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--borde);background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--gris);}
  .sign-tabs button.on{background:var(--verde);color:#fff;border-color:var(--verde);}
  #firma-canvas{border:2px dashed var(--borde);border-radius:8px;touch-action:none;width:100%;background:#fff;display:block;cursor:crosshair;}
  .history-item:hover{border-color:var(--verde);background:var(--verde-cl);}
  .history-item .meta strong{display:block;font-size:13px;}
  .history-item .meta span{font-size:11px;color:var(--gris);}
  .view-toggle{display:flex;gap:6px;margin-bottom:12px;}
  .view-toggle button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--borde);background:var(--blanco);font-size:12.5px;font-weight:600;color:var(--gris);cursor:pointer;}
  .view-toggle button.on{background:var(--verde-osc);border-color:var(--verde-osc);color:var(--blanco);}
  .acta-doc{
    background:#fffefb;border:1px solid var(--borde);border-radius:12px;padding:0 26px 34px;
    font-family:Georgia,'Times New Roman',serif;box-shadow:0 2px 12px rgba(31,61,44,.07);
    position:relative;overflow:hidden;
  }
  .acta-banner-wrap{position:relative;margin:0 -26px 22px;height:150px;overflow:hidden;border-radius:12px 12px 0 0;}
  .acta-banner-img{width:100%;height:100%;object-fit:cover;display:block;}
  .acta-logo-on-banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));}
  .home-hero{position:relative;height:150px;border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 3px 10px rgba(0,0,0,.15);}
  .home-hero-img{width:100%;height:100%;object-fit:cover;display:block;}
  .home-hero-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.55));}
  .acta-divider{text-align:center;color:var(--dorado);letter-spacing:10px;font-size:12px;margin:20px 0;}
  .acta-motto{text-align:center;font-size:11.5px;letter-spacing:2.5px;color:var(--gris);text-transform:uppercase;margin:0 0 4px;}
  .acta-sub{text-align:center;font-size:12.5px;color:var(--gris);font-style:italic;margin:0 0 10px;}
  .acta-saludo{text-align:center;font-weight:700;font-size:14.5px;color:var(--verde-osc);margin:0 0 16px;}
  .acta-num{text-align:center;font-weight:700;font-size:19px;color:var(--dorado);letter-spacing:1.5px;margin:0 0 22px;text-transform:uppercase;}
  .acta-intro{font-size:13.5px;line-height:1.85;text-align:justify;color:#2a2f2b;margin:0 0 18px;font-style:italic;}
  .acta-autoridad{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dotted var(--borde);}
  .acta-autoridad .cargo{color:var(--verde-osc);font-weight:700;white-space:nowrap;}
  .acta-autoridad .nombre{color:#2a2f2b;text-align:right;}
  .acta-header{font-size:12.5px;color:var(--blanco);font-weight:700;margin:22px 0 10px;padding:8px 14px;
    background:var(--verde-osc);text-transform:uppercase;letter-spacing:.6px;border-radius:4px;}
  .acta-ornamento{text-align:center;color:var(--dorado);font-size:13px;letter-spacing:4px;margin:0 0 6px;}
  .acta-body{font-size:13.5px;line-height:1.9;text-align:justify;color:#26302a;margin:0 0 10px;}
  .acta-firma-row{display:flex;gap:14px;margin-top:36px;}
  .acta-firma-row .col{flex:1;text-align:center;border-top:2px solid var(--dorado);padding-top:8px;
    font-weight:700;font-size:11px;letter-spacing:1.5px;color:var(--verde-osc);text-transform:uppercase;}
</style>
</head>

<div id="app">
  <header class="top">
    <div style="display:flex;align-items:center;gap:10px;">
      <img id="hdr-logo" alt="" style="width:36px;height:36px;flex-shrink:0;">
      <div>
        <h1 id="hdr-title">Restirador</h1>
        <div class="sub" id="hdr-sub">Resp.'. Log.'. José Hernández N°75</div>
      </div>

    <div style="display:flex;gap:6px;">
      <button id="btn-home" onclick="goHome()">Inicio</button>
      <button id="btn-panel" onclick="window.location.href='../index.html'">Panel</button>

  <div id="stepper" class="stepper" style="display:none;"></div>
  <main id="main"></main>

</div>

const BUCKET_FIRMAS = 'firmas';
const BUCKET_ACTAS = 'actas';

const ITEM_DEFS = [
  {type:'lectura_acta', label:'Lectura y aprobación del acta anterior', defaultOn:true},
  {type:'asuntos_secretaria', label:'Asuntos de Secretaría', defaultOn:true},
  {type:'disculpas', label:'Asistencia y disculpas de HH ausentes', defaultOn:true, mandatory:true},
  {type:'entre_columnas', label:'Puesta entre columnas (juramentos / incorporaciones)', defaultOn:false},
  {type:'proposiciones', label:'Saco de las proposiciones (planchas / trazados)', defaultOn:true},

  {type:'libre', label:'Punto libre (otro asunto)', defaultOn:false}
];

let state = {
  config: null,          // se arma en cargarDatosBase() a partir de Supabase
  view: 'home',
  acta: null,
  stepIndex: 0,
  loaded: false,
  esSecretario: false,
  miHermanoId: null,
  hermanosActivos: [],    // padrón activo completo [{id, nombre_completo, grado_id}]

  asistCurrent: null,
  asistHistoryPath: {year:null},
  _gradoNumPorId: {},     // grado_id (Supabase) -> 1/2/3
  _gradoIdPorNum: {}      // 1/2/3 -> grado_id (Supabase)
};

function gradoNumDeId(id){ return state._gradoNumPorId[id] || 1; }
function gradoIdDeNum(n){ return state._gradoIdPorNum[n]; }

// HH∴ elegibles para una tenida de grado `gradoNum`: activos, de ese grado o superior
// (regla real de logia: nadie de grado inferior puede estar presente en la tenida).
function hhDisponibles(gradoNum){
  return state.hermanosActivos
    .filter(h => gradoNumDeId(h.grado_id) >= gradoNum)
    .map(h => h.nombre_completo);
}

// ============================================================
// Carga inicial: sesión, padrón, cargos, grados y config de Secretaría
// ============================================================
async function cargarDatosBase(){
  const sesion = await exigirSesion();
  if(!sesion) return false;

  const [
    { data: soySec, error: errSec },
    { data: gradosData, error: errGrados },
    { data: cargosData, error: errCargos },
    { data: hermanosData, error: errHerm },
    { data: vigentesData, error: errVig },
    { data: cfgData, error: errCfg }
  ] = await Promise.all([
    db.rpc('soy_secretario'),
    db.from('grados').select('*').order('orden'),
    db.from('cargos').select('*').order('orden'),
    db.from('hermanos').select('id, nombre_completo, grado_id, activo, auth_user_id'),
    db.from('hermano_cargos').select('cargo_id, hermanos(id, nombre_completo)').eq('vigente', true),
    db.from('secretaria_config').select('*').eq('id', 1).maybeSingle()
  ]);

  if(errSec) console.error('soy_secretario()', errSec);
  if(errGrados) console.error('grados', errGrados);
  if(errCargos) console.error('cargos', errCargos);
  if(errHerm) console.error('hermanos', errHerm);
  if(errVig) console.error('hermano_cargos', errVig);
  if(errCfg) console.error('secretaria_config', errCfg);

  state.esSecretario = !!soySec;

  const hermanos = hermanosData || [];
  state.hermanosActivos = hermanos.filter(h => h.activo);
  const miLegajo = hermanos.find(h => h.auth_user_id === sesion.user.id);
  state.miHermanoId = miLegajo ? miLegajo.id : null;

  // Grados 1/2/3, en el mismo orden en que ya se usaban en toda la app.
  const gradosOrdenados = (gradosData || []);
  state._gradoNumPorId = {};
  state._gradoIdPorNum = {};
  const grados = {};
  gradosOrdenados.forEach((g, i) => {
    const n = i + 1;
    state._gradoNumPorId[g.id] = n;
    state._gradoIdPorNum[n] = g.id;
    grados[n] = {
      id: g.id,
      label: g.nombre,
      presidente: g.tratamiento_presidente || '',
      hermano_sing: g.hermano_sing || '',
      hermano_pl: g.hermano_pl || '',
      saludo: g.saludo || ''
    };
  });

  // Titular vigente por cargo (para el cuadro de autoridades de la tenida).
  const titularPorCargoId = {};
  (vigentesData || []).forEach(v => {
    if(v.hermanos) titularPorCargoId[v.cargo_id] = v.hermanos.nombre_completo;
  });
  const cargosCuadro = (cargosData || [])
    .filter(c => c.orden !== null && c.orden !== undefined)
    .sort((a,b) => a.orden - b.orden)
    .map(c => ({ id: c.id, label: c.nombre, titular: titularPorCargoId[c.id] || null }));

  const cargoVM = (cargosData || []).find(c => (c.nombre||'').trim().toLowerCase() === 'venerable maestro');
  const presidenteActual = cargoVM ? (titularPorCargoId[cargoVM.id] || null) : null;

  const cfg = cfgData || {};
  state.config = {
    cargos: cargosCuadro,
    presidente: presidenteActual,
    hh: state.hermanosActivos.map(h => h.nombre_completo),
    grados,
    counters: { 1: cfg.contador_grado1 || 0, 2: cfg.contador_grado2 || 0, 3: cfg.contador_grado3 || 0 },
    lugar: cfg.lugar || '',
    nombreTaller: cfg.nombre_taller || ''
  };

  state.loaded = true;
  return true;
}

async function guardarSecretariaConfig(){
  const c = state.config;
  const { error } = await db.from('secretaria_config').update({
    nombre_taller: c.nombreTaller,
    lugar: c.lugar,
    contador_grado1: c.counters[1],
    contador_grado2: c.counters[2],
    contador_grado3: c.counters[3],
    actualizado_en: new Date().toISOString()
  }).eq('id', 1);
  if(error){ toast('No se pudo guardar la configuración'); console.error(error); return false; }

  const updates = [1,2,3].map(n => {
    const g = c.grados[n];
    return db.from('grados').update({
      tratamiento_presidente: g.presidente,
      hermano_sing: g.hermano_sing,
      hermano_pl: g.hermano_pl,
      saludo: g.saludo
    }).eq('id', gradoIdDeNum(n));
  });
  const results = await Promise.all(updates);
  const fallo = results.find(r => r.error);
  if(fallo){ toast('No se pudieron guardar los textos por grado'); console.error(fallo.error); return false; }
  return true;
}

/* ---------- HISTORIAL (carpetas: año > grado > actas) ---------- */
function actaYear(h){
  if(h.anioCompleto) return h.anioCompleto;
  if(h.fecha && h.fecha.length>=4) return h.fecha.slice(0,4);
  if(h.anio) return '20'+h.anio;
  return 'Sin fecha';
}
function actaGrado(h){
  if(h.grado) return h.grado;
  if(/segundo/i.test(h.gradoLabel||'')) return 2;
  if(/c[aá]mara/i.test(h.gradoLabel||'')) return 3;
  return 1;
}
function groupHistory(list){
  const byYear = {};
  list.forEach(h=>{
    const y = actaYear(h);
    byYear[y] = byYear[y] || {1:[],2:[],3:[]};
    byYear[y][actaGrado(h)].push(h);
  });
  return byYear;
}
function crumbBtn(label, onclick){

function closeScanModal(){
  const el = document.getElementById('scan-modal-overlay');
  if(el) el.remove();
  state._scanDataUrl = null;
}
function handleScanFileChange(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 1600;
      const scale = Math.min(1, maxW/img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      state._scanDataUrl = dataUrl;
      const kb = Math.round(dataUrl.length*0.75/1024);
      document.getElementById('scan-preview').innerHTML = `<img src="${dataUrl}" style="max-width:100%;border-radius:8px;border:1px solid var(--borde);margin-top:8px;">
        <p class="muted" style="margin-top:4px;">Tamaño aproximado: ${kb} KB</p>`;
      document.getElementById('scan-save-btn').disabled = false;
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
async function saveScannedActa(){
  if(!state.esSecretario) return;
  if(!state._scanDataUrl){ toast('Elegí una imagen primero'); return; }
  const grado = parseInt(document.getElementById('scan-grado').value);
  const fecha = document.getElementById('scan-fecha').value;
  if(!fecha){ toast('Cargá la fecha del acta'); return; }
  const numeroVal = document.getElementById('scan-numero').value;
  const numero = numeroVal ? parseInt(numeroVal) : null;

  const btn = document.getElementById('scan-save-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }

  try{
    const blob = await (await fetch(state._scanDataUrl)).blob();
    const path = `${uid()}.jpg`;
    const { error: errSubida } = await db.storage.from(BUCKET_ACTAS).upload(path, blob, {contentType:'image/jpeg'});
    if(errSubida) throw errSubida;

    const { data, error } = await db.from('actas').insert({
      tipo: 'escaneada',
      grado_id: gradoIdDeNum(grado),
      numero,
      fecha,
      scan_archivo_url: path,
      firmada: false,
      estado: 'activa',
      creado_por: state.miHermanoId
    }).select().single();
    if(error) throw error;

    state._scanDataUrl = null;
    closeScanModal();
    toast('Acta escaneada archivada');
    window._histCache = await getHistory();
    openActa(data.id);
  }catch(err){
    console.error(err);
    toast('No se pudo guardar el acta escaneada');
    if(btn){ btn.disabled = false; btn.textContent = 'Guardar'; }
  }
}

async function descargarEscaneada(id){
  const url = window._currentScanUrl;
  if(!url) return;
  const blob = await (await fetch(url)).blob();
  const objUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = objUrl; a.download = 'Acta_escaneada_'+id+'.jpg';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(objUrl);
}

/* ---------- FIRMAS: se toman de la firma digital ya cargada en Legajos ---------- */
async function buscarTitularCargo(nombreCargo){
  const { data, error } = await db
    .from('hermano_cargos')
    .select('hermano_id, hermanos(id, nombre_completo, firma_url), cargos!inner(nombre)')
    .eq('vigente', true)
    .eq('cargos.nombre', nombreCargo)
    .maybeSingle();
  if(error || !data || !data.hermanos) return null;
  return { id: data.hermanos.id, nombre: data.hermanos.nombre_completo, firmaUrl: data.hermanos.firma_url };
}
async function urlToDataUri(url){
  const resp = await fetch(url);
  const blob = await resp.blob();
  return await new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function firmasParaMostrar(record){
  const ids = { presidente: record._firmantePresidenteId, secretario: record._firmanteSecretarioId, orador: record._firmanteOradorId };
  const idList = Object.values(ids).filter(Boolean);
  if(!idList.length) return null;
  const { data, error } = await db.from('hermanos').select('id, firma_url').in('id', idList);
  if(error || !data) return null;
  const pathPorId = {};
  data.forEach(h => { pathPorId[h.id] = h.firma_url; });
  const urls = {};
  for(const role of ['presidente','secretario','orador']){
    const path = pathPorId[ids[role]];
    if(!path) continue;
    const { data: signed } = await db.storage.from(BUCKET_FIRMAS).createSignedUrl(path, 300);
    if(signed) urls[role] = signed.signedUrl;
  }
  return urls;
}
async function firmasParaDocx(record){
  const urls = await firmasParaMostrar(record);
  if(!urls) return null;
  const out = {};
  for(const role of ['presidente','secretario','orador']){
    if(!urls[role]) continue;
    try{ out[role] = await urlToDataUri(urls[role]); }catch(e){ console.error(e); }
  }
  return out;
}

async function firmarActa(id){
  if(!state.esSecretario){ toast('Solo el Secretario (o V∴M∴) puede firmar actas'); return; }
  const [presidente, secretario, orador] = await Promise.all([
    buscarTitularCargo('Venerable Maestro'),
    buscarTitularCargo('Secretario'),
    buscarTitularCargo('Orador')
  ]);
  const faltantes = [];
  if(!presidente) faltantes.push('el cargo de Venerable Maestro está vacante');
  else if(!presidente.firmaUrl) faltantes.push(`falta la firma de ${presidente.nombre} (Venerable Maestro) en Legajos`);
  if(!secretario) faltantes.push('el cargo de Secretario está vacante');
  else if(!secretario.firmaUrl) faltantes.push(`falta la firma de ${secretario.nombre} (Secretario) en Legajos`);
  if(!orador) faltantes.push('el cargo de Orador está vacante');
  else if(!orador.firmaUrl) faltantes.push(`falta la firma de ${orador.nombre} (Orador) en Legajos`);
  if(faltantes.length){
    toast(faltantes[0]);
    return;
  }
  if(!confirm('Esto firma el acta con las firmas cargadas hoy en Legajos para Presidente, Secretario y Orador, dando por hecho que ya fue leída y aprobada en tenida. ¿Confirmás?')) return;

  const { error } = await db.from('actas').update({
    firmada: true,
    fecha_firma: new Date().toISOString(),
    firmante_presidente_id: presidente.id,
    firmante_secretario_id: secretario.id,
    firmante_orador_id: orador.id
  }).eq('id', id);
  if(error){ toast('No se pudo firmar el acta'); console.error(error); return; }
  window._histCache = await getHistory();
  toast('Acta firmada');
  render();
}

async function redownload(id, conFirma){
  const list = window._histCache && window._histCache.length ? window._histCache : await getHistory();
  const h = list.find(r=>r.id===id);
  if(!h) return;
  const firmas = (conFirma && h.firmada) ? await firmasParaDocx(h) : null;
  const sufijo = (conFirma && h.firmada) ? '_firmada' : '';
  await downloadDocOrDocx(h.texto, `Acta_${h.numero}-${h.anio}${sufijo}`, firmas, h.grado);
}

function toggleItem(i,val){ if(state.acta.items[i].mandatory) return; state.acta.items[i].enabled=val; }
function moveItem(i,dir){
  const items = state.acta.items;
  const j=i+dir; if(j<0||j>=items.length) return;
  [items[i],items[j]]=[items[j],items[i]];
  renderChecklistItems();
}
function addLibreItem(){
  const titulo = prompt('Título para este punto libre:');

  state.acta.items.push({id:uid(), type:'libre', label:titulo, enabled:true, data:{}});

function goToWizard(){
  state.acta.items.forEach(it=>{ if(it.mandatory) it.enabled = true; });
  state.acta.activeItems = state.acta.items.filter(it=>it.enabled);
  if(!state.acta.activeItems.length){ toast('Elegí al menos un punto del orden del día'); return; }
  state.stepIndex = 0;
  state.view = 'wizard';
  render();
}

/* ---------- PASO 3: WIZARD POR PESTAÑAS ---------- */
function renderWizard(main, stepper, toolbar){
  const items = state.acta.activeItems;
  const idx = Math.min(state.stepIndex, items.length-1);
  const it = items[idx];

  stepper.style.display='flex';
  stepper.innerHTML = items.map((x,i)=>`
    <div class="step-chip ${i===idx?'active':(itemHasData(x)?'done':'')}" onclick="jumpTo(${i})">${i+1}. ${esc(x.label.split('(')[0].trim())}</div>
  `).join('');

  main.innerHTML = `<h2 class="section-title">${esc(it.label)}</h2><div class="card">${renderItemForm(it)}</div>`;
  bindItemFormEvents(it);

  toolbar.style.display='flex';
  toolbar.innerHTML = `
    <button class="btn ghost" onclick="wizardPrev()">${idx===0?'← Orden del día':'← Anterior'}</button>
    <button class="btn" onclick="wizardNext()">${idx===items.length-1?'Ir a revisión →':'Siguiente →'}</button>
  `;
}
function itemHasData(it){ return it.data && Object.keys(it.data).length>0; }
function jumpTo(i){ saveCurrentStepData(); state.stepIndex=i; render(); }
function wizardPrev(){
  saveCurrentStepData();
  if(state.stepIndex===0){ state.view='setup2'; render(); return; }
  state.stepIndex--; render();
}
function wizardNext(){
  saveCurrentStepData();
  saveDraft();
  const items = state.acta.activeItems;
  if(state.stepIndex >= items.length-1){ state.view='review'; render(); return; }
  state.stepIndex++; render();
}

function combinedHH(){

function bindItemFormEvents(it){
  if(it.type==='lectura_acta'){
    const sel = document.getElementById('f-resultado');
    if(sel) sel.addEventListener('change', ()=>{
      document.getElementById('f-obs-wrap').style.display = sel.value==='observ' ? 'block':'none';
    });
  }
  document.querySelectorAll('select[id^="dis-ausente-"], select[id^="dis-excusa-"], select[id^="pl-autor-"], select[id^="bg-hh-"]').forEach(s=>{
    s.addEventListener('change', ()=>{ if(s.value==='__otro__') { saveCurrentStepData(); render(); } });
  });
}

function saveCurrentStepData(){
  const it = currentItem();
  if(!it) return;
  const d = it.data;
  const val = id => { const el=document.getElementById(id); return el?el.value:undefined; };
  const otroVal = (baseId) => { const sel=val(baseId); if(sel==='__otro__'){ const o=val(baseId+'-otro'); return o||''; } return sel; };

  switch(it.type){
    case 'lectura_acta':
      d.fechaAnt = val('f-fecha-ant'); d.resultado = val('f-resultado'); d.observaciones = val('f-observaciones');
      break;
    case 'asuntos_secretaria':
      d.texto = val('f-secretaria');
      break;
    case 'disculpas': {
      (d.filas||[]).forEach((row,i)=>{
        const excusaSel = document.getElementById('disc-excusa-'+i);
        if(excusaSel) row.excusa = otroVal('disc-excusa-'+i);
        const motivoEl = document.getElementById('disc-motivo-'+i);
        if(motivoEl) row.motivo = motivoEl.value;
      });
      const presentesCount = (d.filas||[]).filter(r=>r.estado==='presente').length;
      if(d.filas && d.filas.length) state.acta.presentes = String(presentesCount);
      break; }
    case 'entre_columnas':
      d.nombres = (val('f-columnas')||'').split('\n').map(s=>s.trim()).filter(Boolean);
      break;
    case 'proposiciones': {
      const rows=[]; let i=0;
      while(document.getElementById('pl-titulo-'+i)){
        const comentan = (d.filas && d.filas[i] && d.filas[i].comentan) || [];
        rows.push({autor:otroVal('pl-autor-'+i), titulo:val('pl-titulo-'+i), comentan});
        i++;
      }
      d.filas = rows;
      break; }
    case 'bien_general': {
      const rows=[]; let i=0;
      while(document.getElementById('bg-texto-'+i)){
        rows.push({hh:otroVal('bg-hh-'+i), texto:val('bg-texto-'+i)});
        i++;
      }
      d.filas = rows;
      break; }
    case 'cierre':
      d.monto=val('f-monto'); d.concepto=val('f-concepto');
      d.honores = document.getElementById('f-honores')?document.getElementById('f-honores').checked:true;
      d.cadena = document.getElementById('f-cadena')?document.getElementById('f-cadena').checked:true;
      d.notas = val('f-notas-cierre');
      break;
    case 'libre':
      d.texto = val('f-libre');
      break;
  }
}

/* ---------- PASO 4: REVISIÓN Y GENERACIÓN ---------- */
function renderReview(main, toolbar){
  const texto = buildActaText(state.acta);
  state._reviewMode = state._reviewMode || 'leer';
  main.innerHTML = `
    <h2 class="section-title">Revisión final</h2>
    <div class="view-toggle">
      <button class="${state._reviewMode==='leer'?'on':''}" onclick="switchReviewMode('leer')">Vista previa</button>
      <button class="${state._reviewMode==='editar'?'on':''}" onclick="switchReviewMode('editar')">Editar texto</button>
    </div>
    <div id="review-body"></div>
  `;
  const body = document.getElementById('review-body');
  if(state._reviewMode==='editar'){
    const actual = (state._editedText!==undefined) ? state._editedText : texto;
    body.innerHTML = `<p class="muted">Podés editar el texto libremente antes de generar el documento.</p>
      <div class="field"><textarea id="final-text" style="min-height:420px;font-family:Georgia,serif;font-size:13.5px;line-height:1.7;">${esc(actual)}</textarea></div>`;
  } else {
    body.innerHTML = renderStyledHtml(state._editedText!==undefined ? state._editedText : texto, null, state.acta.grado);
  }

  toolbar.style.display='flex';
  toolbar.innerHTML = `
    <button class="btn ghost" onclick="state.view='wizard'; state.stepIndex=state.acta.activeItems.length-1; state._reviewMode=null; state._editedText=undefined; render();">← Volver a editar</button>
    <button class="btn" onclick="finalizarActa()">Finalizar y archivar acta</button>
  `;
}

function switchReviewMode(mode){
  const editArea = document.getElementById('final-text');
  if(editArea) state._editedText = editArea.value;
  state._reviewMode = mode;
  render();
}

async function finalizarActa(){
  if(!state.esSecretario) return;
  const editArea = document.getElementById('final-text');
  if(editArea) state._editedText = editArea.value;
  const texto = state._editedText!==undefined ? state._editedText : buildActaText(state.acta);
  const a = state.acta;

  const { data, error } = await db.from('actas').insert({
    tipo: 'generada',
    grado_id: gradoIdDeNum(a.grado),
    numero: a.numero,
    fecha: a.fecha,
    presentes: a.presentes ? parseInt(a.presentes) : null,
    visitantes: a.visitantes ? parseInt(a.visitantes) : null,
    autoridades: a.autoridades,
    items: a.items,
    texto,
    firmada: false,
    estado: 'activa',
    creado_por: state.miHermanoId
  }).select().single();

  if(error){
    console.error(error);
    if(error.code === '23505') toast('Ya existe una acta con ese número para este grado. Cambiá el N° de acta y volvé a intentar.');
    else toast('No se pudo archivar el acta');
    return;
  }

  state.config.counters[a.grado] = Math.max(state.config.counters[a.grado], a.numero);
  await guardarSecretariaConfig();
  await volcarAsistenciaDesdeActa(a, data.id);
  await clearDraft();
  toast('Acta archivada en el Libro de actas');
  state.acta=null; state._reviewMode=null; state._editedText=undefined;
  window._histCache = await getHistory();
  openActa(data.id);
}
async function volcarAsistenciaDesdeActa(a, actaId){
  const item = a.items.find(it=>it.type==='disculpas');
  if(!item || !item.data || !item.data.filas || !item.data.filas.length) return;
  const asistencia = item.data.filas.map(r=>({nombre:r.nombre, estado:r.estado||'presente', motivo:r.motivo||''}));
  const { error } = await db.from('asistencia_registros').insert({
    acta_id: actaId,
    grado_id: gradoIdDeNum(a.grado),
    fecha: a.fecha,
    asistencia,
    creado_por: state.miHermanoId
  });
  if(error){ console.error(error); toast('El acta se archivó, pero no se pudo guardar la asistencia'); return; }
  await cargarAsistRegistros();
}

/* ========================= GENERACIÓN DE TEXTO ========================= */
function numberWord(n){
  const map={0:'cero',1:'un',2:'dos',3:'tres',4:'cuatro',5:'cinco',6:'seis',7:'siete',8:'ocho',9:'nueve',10:'diez',11:'once',12:'doce'};
  return map[n] !== undefined ? map[n] : String(n);
}
function firstName(full){
  if(!full) return full;
  return full.trim().split(/\s+/)[0];
}
function joinNames(arr){
  arr = arr.filter(Boolean);
  if(arr.length===0) return '';
  if(arr.length===1) return arr[0];
  return arr.slice(0,-1).join(', ') + ' y ' + arr[arr.length-1];
}
function fmtFecha(iso){
  if(!iso) return '';
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const [y,m,d]=iso.split('-').map(Number);
  return `${d} de ${meses[m-1]} de ${y}`;
}

function buildActaText(a){
  const cfg = state.config;
  const gd = cfg.grados[a.grado];
  const lines = [];
  lines.push("A L.'. G.'. D.'. G.'. A.'. D.'. U.'.");
  lines.push(`${cfg.lugar}, ${fmtFecha(a.fecha)} (e.'. v.'.)`);
  lines.push(`${gd.saludo}:`);
  lines.push('');
  lines.push(`ACTA N° ${a.numero}/${(a.fecha||'').slice(2,4)}`);
  lines.push('');
  let presentesTxt = '';
  if(a.presentes){
    const n = parseInt(a.presentes);
    presentesTxt = `contando con la asistencia de ${numberWord(n)} ${gd.hermano_pl} del Taller`;
  }
  const visN = parseInt(a.visitantes);
  if(visN>0){
    const visTxt = visN===1 ? `un ${gd.hermano_sing} visitante` : `${numberWord(visN)} ${gd.hermano_pl} visitantes`;
    presentesTxt = presentesTxt ? `${presentesTxt} y ${visTxt}` : `contando con la asistencia de ${visTxt}`;
  }
  lines.push(`Bajo los auspicios de la Serenísima Gran Logia de Italia, Orden General de los Antiguos Masones Libres y Aceptados, se dan inicio a los trabajos en ${gd.label}${presentesTxt? ', '+presentesTxt : ''}, bajo el siguiente cuadro de autoridades:`);
  lines.push('');
  a.autoridades.forEach(au=>{
    if(au.titular==='__vacante__') return;
    const nombre = au.titular==='__otro__' ? '' : au.titular;
    lines.push(`${au.label}${au.acc?' Acc.\'.':''}: ${nombre}`);
  });
  lines.push('');

  a.activeItems.forEach(it=>{
    const block = renderItemText(it, a, gd);
    if(block){ lines.push(block); lines.push(''); }
  });

  lines.push('Presidente  Secretario  Orador');
  return lines.join('\n');
}

function renderItemText(it, a, gd){
  const d = it.data||{};
  switch(it.type){
    case 'lectura_acta': {
      const fecha = d.fechaAnt ? fmtFecha(d.fechaAnt) : '';
      if(d.resultado==='observ'){
        return `Lectura y aprobación del acta anterior\nSe da lectura al acta correspondiente a la tenida del ${fecha}. Se realizan las siguientes observaciones: ${d.observaciones||'—'}. Con las correcciones señaladas, es sometida a votación y aprobada por unanimidad.`;
      }
      return `Lectura y aprobación del acta anterior\nSe da lectura al acta correspondiente a la tenida del ${fecha}, la cual, no mediando observaciones, es sometida a votación y aprobada por unanimidad.`;
    }
    case 'asuntos_secretaria':
      if(!d.texto) return '';
      return `Asuntos de Secretaría\nSe da lectura a los asuntos de Secretaría. ${d.texto}`;
    case 'disculpas': {
      const filas=(d.filas||[]).filter(r=>r.estado==='disculpado');
      if(!filas.length) return '';
      const frases = filas.map(r=>{
        let s = `El ${gd.hermano_sing} ${firstName(r.excusa)||'—'}`;
        s += ` presenta disculpas por la ausencia del ${gd.hermano_sing} ${firstName(r.nombre)}`;
        if(r.motivo) s += `, en razón de ${r.motivo}`;
        return s+'.';
      });
      return `Disculpas de Hermanos ausentes\nSe circula la palabra a fin de presentar disculpas por parte de ${gd.hermano_pl} ausentes.\n${frases.join('\n')}`;
    }
    case 'entre_columnas': {
      const nombres=(d.nombres||[]).filter(Boolean).map(firstName);
      if(!nombres.length) return '';
      return `Puesta entre columnas\nEl ${gd.presidente} dispone poner entre columnas a los ${gd.hermano_pl} ${joinNames(nombres)}, a quienes toma juramento, siendo luego proclamados como miembros regulares y activos de este Taller.`;
    }
    case 'proposiciones': {
      const filas=(d.filas||[]).filter(r=>r.titulo);
      if(!filas.length) return '';
      const frases = filas.map(r=>{
        const nombrados = (r.comentan||[]).filter(c=>c!=='__presidente__').map(firstName);
        const incluyePresidente = (r.comentan||[]).includes('__presidente__');
        let comTxt = '';
        if(nombrados.length===1){
          comTxt = `que es comentada por el ${gd.hermano_sing} ${nombrados[0]}`;
        } else if(nombrados.length>1){
          comTxt = `que es comentada por los ${gd.hermano_pl} ${joinNames(nombrados)}`;
        }
        if(incluyePresidente){
          comTxt = comTxt ? `${comTxt} y por el ${gd.presidente}` : `que es comentada por el ${gd.presidente}`;
        }
        return `El ${gd.hermano_sing} ${firstName(r.autor)||'—'} da lectura a su plancha titulada "${r.titulo}"${comTxt? ', '+comTxt : ''}.`;
      });
      return `Saco de las proposiciones\nCircula el saco de proposiciones, que llega fértil a Oriente.\n${frases.join('\n')}`;
    }
    case 'bien_general': {
      const filas=(d.filas||[]).filter(r=>r.texto);
      if(!filas.length) return '';
      const frases = filas.map(r=> `El ${gd.hermano_sing} ${firstName(r.hh)||'—'}, ${r.texto}.`);
      return `Palabra en bien general de la Orden\nSe circula la palabra en bien general de la Orden y del Taller en particular, haciendo uso de ella:\n${frases.join('\n')}`;
    }
    case 'cierre': {
      let s = `Cierre de los trabajos\n`;
      if(d.monto) s += `Circula el tronco de la viuda, que arroja la suma de $${d.monto} en ${d.concepto||'medallas profanas'}. `;
      if(d.notas) s += `${d.notas} `;
      s += `No habiendo más asuntos que tratar${d.honores!==false? ', se rinden los honores al Pabellón Nacional':''} y se cierran los trabajos${d.cadena!==false? ', para continuar con la Cadena de Unión y el ágape fraterno.':'.'}`;
      return s;
    }
    case 'libre':
      if(!d.texto) return '';
      return `${it.label}\n${d.texto}`;
    default: return '';
  }
}

/* ========================= VISTA ESTILIZADA (lectura) ========================= */
function parseActaToStyledLines(text){
  const blocks = (text||'').split(/\n\s*\n+/).map(b=>b.split('\n').filter(l=>l.trim()!==''));
  const out = [];
  blocks.forEach((blockLines, bi)=>{
    if(!blockLines.length) return;
    if(bi===0){
      if(blockLines[0]) out.push({style:'letterhead-title', text:blockLines[0]});
      if(blockLines[1]) out.push({style:'letterhead-sub', text:blockLines[1]});
      if(blockLines[2]) out.push({style:'saludo', text:blockLines[2]});
      return;
    }
    if(bi===1 && /^ACTA N°/.test(blockLines[0])){ out.push({style:'acta-num', text:blockLines[0]}); return; }
    if(bi===2){ blockLines.forEach(l=>out.push({style:'intro', text:l})); return; }
    if(bi===3 && blockLines.every(l=>l.includes(':'))){ blockLines.forEach(l=>out.push({style:'autoridad', text:l})); return; }
    if(blockLines.length===1 && /^Presidente\s+Secretario\s+Orador/.test(blockLines[0])){
      out.push({style:'firma', text: blockLines[0]});
      return;
    }
    out.push({style:'header', text: blockLines[0]});
    for(let i=1;i<blockLines.length;i++) out.push({style:'body', text: blockLines[i]});
  });
  return out;
}
function styledLineToHtml(item, firmas){
  switch(item.style){
    case 'letterhead-title': return `<p class="acta-motto">${esc(item.text)}</p>`;
    case 'letterhead-sub': return `<p class="acta-sub">${esc(item.text)}</p>`;
    case 'saludo': return `<p class="acta-saludo">${esc(item.text)}</p>`;
    case 'acta-num': return `<p class="acta-ornamento">❧ · ✦ · ❧</p><p class="acta-num">${esc(item.text)}</p>`;
    case 'intro': return `<p class="acta-intro">${esc(item.text)}</p>`;
    case 'autoridad': {
      const idx = item.text.indexOf(':');
      if(idx<0) return `<p class="acta-body">${esc(item.text)}</p>`;
      const cargo=item.text.slice(0,idx+1), nombre=item.text.slice(idx+1).trim();
      return `<div class="acta-autoridad"><span class="cargo">${esc(cargo)}</span><span class="nombre">${esc(nombre)}</span></div>`;
    }
    case 'header': return `<h3 class="acta-header">${esc(item.text)}</h3>`;
    case 'firma': {
      const partes = item.text.split(/\s{2,}|\t/).map(s=>s.trim()).filter(Boolean);
      const roles = ['presidente','secretario','orador'];
      const labels = (partes.length===3?partes:['Presidente','Secretario','Orador']);
      const cols = labels.map((p,i)=>{
        const key = roles[i];
        const img = (firmas && firmas[key]) ? `<img src="${firmas[key]}" style="max-height:42px;max-width:100%;object-fit:contain;display:block;margin:0 auto 4px;">` : '';
        return `<div class="col">${img}<div>${esc(p)}</div></div>`;
      }).join('');
      return `<div class="acta-firma-row">${cols}</div>`;
    }
    default: return `<p class="acta-body">${esc(item.text)}</p>`;
  }
}
function renderStyledHtml(text, firmas, grado){
  return `<div class="acta-doc">${parseActaToStyledLines(text).map(it=>styledLineToHtml(it, firmas)).join('')}</div>`;
}

/* ========================= EXPORTAR A WORD ========================= */
async function downloadDocOrDocx(text, filename, firmas, grado){
  if(typeof JSZip !== 'undefined'){
    try{ await downloadDocx(text, filename, firmas, grado); return; }
    catch(e){ console.error('Fallo generación .docx', e); }
  }
  downloadDocLegacy(text, filename);
  toast('No se pudo generar .docx (¿sin conexión?); se descargó en un formato alternativo');
}

function xmlEsc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function parseDataUri(dataUri){
  const m = /^data:image\/(png|jpe?g);base64,(.+)$/i.exec(dataUri||'');
  if(!m) return {ext:'png', base64:''};
  const ext = /jpe?g/i.test(m[1]) ? 'jpg' : 'png';
  return {ext, base64:m[2]};
}
function wRun(text, o){
  o=o||{};
  let rpr='<w:rPr>';
  if(o.bold) rpr+='<w:b/>';
  if(o.italic) rpr+='<w:i/>';
  rpr+=`<w:color w:val="${o.color||'26302A'}"/>`;
  rpr+=`<w:sz w:val="${o.size||21}"/><w:szCs w:val="${o.size||21}"/>`;
  rpr+='</w:rPr>';
  return `<w:r>${rpr}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r>`;
}
function wPara(runsXml, o){
  o=o||{};
  let ppr='<w:pPr>';
  if(o.align) ppr+=`<w:jc w:val="${o.align}"/>`;
  ppr+=`<w:spacing w:before="${o.before||0}" w:after="${o.after||120}"/>`;
  if(o.borderTop) ppr+='<w:pBdr><w:top w:val="single" w:sz="8" w:space="6" w:color="B8963D"/></w:pBdr>';
  if(o.borderLeft) ppr+='<w:pBdr><w:left w:val="single" w:sz="18" w:space="8" w:color="B8963D"/></w:pBdr>';
  if(o.indentLeft) ppr+=`<w:ind w:left="${o.indentLeft}"/>`;
  ppr+='</w:pPr>';
  return `<w:p>${ppr}${runsXml}</w:p>`;
}
const DOCX_CONTENT_W = 9072; // ancho útil de página (A4, márgenes 1417 c/u)

function firmaTable(parts, firmas){
  if(parts.length!==3) parts = ['Presidente','Secretario','Orador'];
  const roles = ['presidente','secretario','orador'];

function styledLineToDocxParagraph(item){
  switch(item.style){
    case 'letterhead-title': return wPara(wRun(item.text,{bold:true,color:'1F3D2C',size:18}), {align:'center', after:60});
    case 'letterhead-sub': return wPara(wRun(item.text,{italic:true,color:'5B6360',size:18}), {align:'center', after:120});
    case 'saludo': return wPara(wRun(item.text,{bold:true,color:'1F3D2C',size:22}), {align:'center', after:220});
    case 'acta-num': return wPara(wRun(item.text,{bold:true,color:'B8963D',size:30}), {align:'center', before:80, after:260});
    case 'intro': return wPara(wRun(item.text,{italic:true,size:21}), {align:'both', after:220});
    case 'autoridad': {
      const idx = item.text.indexOf(':');
      const cargo = idx<0? item.text : item.text.slice(0,idx+1);
      const nombre = idx<0? '' : ' '+item.text.slice(idx+1).trim();
      return wPara(wRun(cargo,{bold:true,color:'1F3D2C',size:20})+wRun(nombre,{size:20}), {align:'left', after:60});
    }
    default: return wPara(wRun(item.text,{size:21}), {align:'both', after:100});
  }
}

async function downloadDocx(text, filename, firmas, grado){
  const items = parseActaToStyledLines(text);
  let body = '';
  body += logoImagePara();
  body += wPara('', {after:60});
  let i = 0;
  while(i < items.length){
    const item = items[i];
    if(item.style==='autoridad'){
      const buffer = [];
      while(i < items.length && items[i].style==='autoridad'){ buffer.push(items[i].text); i++; }
      body += autoridadesTableXml(buffer);
      body += wPara('', {after:120});
      continue;
    }
    if(item.style==='header'){
      body += headerBanner(item.text);
      body += wPara('', {after:60});
    } else if(item.style==='firma'){
      const parts = item.text.split(/\s{2,}|\t/).map(s=>s.trim()).filter(Boolean);
      body += wPara('', {before:160});
      body += firmaTable(parts, firmas);
    } else if(item.style==='acta-num'){
      body += ornamentPara();
      body += styledLineToDocxParagraph(item);
    } else {
      body += styledLineToDocxParagraph(item);
    }
    i++;
  }

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
<w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body>
</w:document>`;

  // Imágenes a incrustar: el logo y el banner de grado siempre, más las 3 firmas si corresponde
  const mediaFiles = [
    {name:'image1.png', base64:LOGO_PNG_B64}
  ];
  const relEntries = [
    '<Relationship Id="rIdLogo" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image1.png"/>'
  ];
  const extraExts = new Set();
  if(firmas){
    ['presidente','secretario','orador'].forEach(role=>{
      if(!firmas[role]) return;
      const parsed = parseDataUri(firmas[role]);
      if(!parsed.base64) return;
      const fname = `signature_${role}.${parsed.ext}`;
      mediaFiles.push({name:fname, base64:parsed.base64});
      relEntries.push(`<Relationship Id="rIdSign${role}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${fname}"/>`);
      extraExts.add(parsed.ext);
    });
  }
  const extMime = {png:'image/png', jpg:'image/jpeg'};
  const extraContentTypeLines = Array.from(extraExts).filter(e=>e!=='png').map(e=>`<Default Extension="${e}" ContentType="${extMime[e]||'image/jpeg'}"/>`).join('\n');

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Default Extension="png" ContentType="image/png"/>
${extraContentTypeLines}
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>
<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>
</Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>
<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>
</Relationships>`;
  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${relEntries.join('\n')}
</Relationships>`;
  const core = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
<dc:title>${xmlEsc(filename)}</dc:title><dc:creator>Actas de la Logia</dc:creator>
</cp:coreProperties>`;
  const appXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Actas de la Logia</Application></Properties>`;

  const zip = new JSZip();
  zip.file("[Content_Types].xml", contentTypes);
  zip.folder("_rels").file(".rels", rels);
  zip.folder("word").file("document.xml", documentXml);
  zip.folder("word").folder("_rels").file("document.xml.rels", docRels);
  const mediaFolder = zip.folder("word").folder("media");
  mediaFiles.forEach(m=> mediaFolder.file(m.name, m.base64, {base64:true}));
  zip.folder("docProps").file("core.xml", core);
  zip.folder("docProps").file("app.xml", appXml);
  const blob = await zip.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename + '.docx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadDocLegacy(plainText, filename){
  const bodyHtml = plainText.split('\n').map(line=>{
    if(!line.trim()) return '<p>&nbsp;</p>';
    const isHeading = /^(Lectura y|Asuntos de|Disculpas de|Puesta entre|Apertura y cierre|Saco de las|Palabra en bien|Cierre de)/.test(line) && line.split(' ').length<8 && !line.includes('.');
    if(isHeading) return `<p style="font-weight:bold;margin-top:14px;">${esc(line)}</p>`;
    if(/^A L\.'\. G\.'\./.test(line) || /^ACTA N°/.test(line)) return `<p style="text-align:center;font-weight:bold;">${esc(line)}</p>`;
    return `<p>${esc(line)}</p>`;
  }).join('\n');

  const html = `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${esc(filename)}</title>
<style>
  body{font-family:'Garamond','Georgia',serif;font-size:12pt;line-height:1.5;}
  p{margin:0 0 8px;}
</style>
</head>
<body>${bodyHtml}</body></html>`;

  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename + '.doc';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ========================= LIBRO DE ASISTENCIA ========================= */
function goAsistHome(){ state.view='asist-home'; state.asistCurrent=null; render(); }

function renderAsistHome(main, toolbar){
  main.innerHTML = `
    <h2 class="section-title">Libro de Asistencia</h2>
    <div class="home-grid">
      <div class="home-card" onclick="state.view='asist-registros';render();">
        <div class="icon">📁</div>
        <div class="txt"><strong>Registros</strong><span>Ver asistencias tomadas, por año</span></div>
      </div>
      <div class="home-card" onclick="state.view='asist-grilla';render();">
        <div class="icon">▦</div>
        <div class="txt"><strong>Grilla anual</strong><span>Vista tipo libro: tenidas x hermanos</span></div>
      </div>
      <div class="home-card" onclick="state.view='asist-resumen';render();">
        <div class="icon">📊</div>
        <div class="txt"><strong>Resumen por hermano</strong><span>Presentes, disculpados y % de asistencia</span></div>
      </div>
    </div>
    <p class="muted" style="margin-top:16px;">La asistencia se toma directamente en cada acta nueva (pestaña "Asistencia y disculpas") y se archiva sola acá — no hace falta cargarla por separado.</p>
  `;
  toolbar.style.display='flex';
  toolbar.innerHTML = `<button class="btn ghost" onclick="goHome()">← Volver a Inicio</button>`;
}

/* ---- Registros por año ---- */
function groupAsistPorAnio(list){
  const out = {};
  list.forEach(r=>{ const y=(r.fecha||'').slice(0,4)||'Sin fecha'; out[y]=out[y]||[]; out[y].push(r); });
  return out;
}
function renderAsistRegistros(main, toolbar){
  if(!state.asistRegistros.length){
    main.innerHTML = `<h2 class="section-title">Registros de asistencia</h2><div class="empty">Todavía no hay tenidas registradas.</div>`;
    toolbar.style.display='flex';
    toolbar.innerHTML = `<button class="btn ghost" onclick="goAsistHome()">← Volver</button>`;
    return;
  }
  const byYear = groupAsistPorAnio(state.asistRegistros);
  const path = state.asistHistoryPath;
  if(!path.year){
    const years = Object.keys(byYear).sort((a,b)=>b.localeCompare(a));
    main.innerHTML = `<h2 class="section-title">Registros de asistencia</h2>` + years.map(y=>`
      <div class="home-card" onclick="state.asistHistoryPath.year='${y}';render();">
        <div class="icon">📁</div>
        <div class="txt"><strong>${esc(y)}</strong><span>${byYear[y].length} tenida${byYear[y].length===1?'':'s'}</span></div>
      </div>`).join('');
    toolbar.style.display='flex';
    toolbar.innerHTML = `<button class="btn ghost" onclick="goAsistHome()">← Volver</button>`;
    return;
  }
  const items = byYear[path.year] || [];
  main.innerHTML = `<h2 class="section-title">Registros — ${esc(path.year)}</h2>` + items.map(r=>{
    const presentes = r.asistencia.filter(a=>a.estado==='presente').length;
    const total = r.asistencia.length;
    return `<div class="history-item" onclick="verAsistDetalle('${r.id}')">
      <div class="meta"><strong>${esc(state.config.grados[r.grado].label)}</strong><span>${r.fecha} — ${presentes}/${total} presentes</span></div>
      <span class="muted">Ver →</span>
    </div>`;
  }).join('');
  toolbar.style.display='flex';
  toolbar.innerHTML = `<button class="btn ghost" onclick="state.asistHistoryPath.year=null;render();">← Atrás</button>`;
}
function verAsistDetalle(id){ state.asistCurrent = state.asistRegistros.find(r=>r.id===id); state.view='asist-detalle'; render(); }
function renderAsistDetalle(main, toolbar){
  const r = state.asistCurrent;
  const presentes = r.asistencia.filter(a=>a.estado==='presente');
  const disculpados = r.asistencia.filter(a=>a.estado==='disculpado');
  const ausentes = r.asistencia.filter(a=>a.estado==='ausente');
  main.innerHTML = `
    <h2 class="section-title">${esc(state.config.grados[r.grado].label)} — ${r.fecha}</h2>
    <div class="card">
      <h3>Presentes <span class="pill">${presentes.length}</span></h3>
      <p>${presentes.map(a=>esc(a.nombre)).join(', ') || '—'}</p>
    </div>
    <div class="card">
      <h3>Ausentes con disculpa <span class="pill" style="background:#f6ecd7;color:var(--dorado);">${disculpados.length}</span></h3>
      ${disculpados.length ? disculpados.map(a=>`<p style="margin:4px 0;"><strong>${esc(a.nombre)}</strong>${a.motivo?' — '+esc(a.motivo):''}</p>`).join('') : '<p class="muted">—</p>'}
    </div>
    <div class="card">
      <h3>Ausentes sin aviso <span class="pill warn">${ausentes.length}</span></h3>
      ${ausentes.length ? ausentes.map(a=>`<p style="margin:4px 0;"><strong>${esc(a.nombre)}</strong>${a.motivo?' — '+esc(a.motivo):''}</p>`).join('') : '<p class="muted">—</p>'}
    </div>
  `;
  toolbar.style.display='flex';
  toolbar.innerHTML = `<button class="btn ghost" onclick="state.view='asist-registros';render();">← Volver</button>`;
}

/* ---- Resumen por hermano ---- */
function renderAsistResumen(main, toolbar){
  const stats = {};
  state.config.hh.forEach(n=> stats[n] = {presentes:0, disculpados:0, ausentes:0});
  state.asistRegistros.forEach(r=>{
    r.asistencia.forEach(a=>{
      if(!stats[a.nombre]) stats[a.nombre] = {presentes:0, disculpados:0, ausentes:0};
      if(a.estado==='presente') stats[a.nombre].presentes++;
      else if(a.estado==='disculpado') stats[a.nombre].disculpados++;
      else stats[a.nombre].ausentes++;
    });
  });
  const rows = Object.keys(stats).map(n=>{
    const s = stats[n];
    const total = s.presentes+s.disculpados+s.ausentes;
    const pct = total ? Math.round(s.presentes/total*100) : 0;
    return {nombre:n, ...s, total, pct};
  }).sort((a,b)=> b.ausentes-a.ausentes);

  main.innerHTML = `
    <h2 class="section-title">Resumen por hermano</h2>
    <p class="muted" style="margin-top:-6px;">Ordenado por ausencias sin aviso, para detectar rápido a quién conviene instruir.</p>
    ${!state.asistRegistros.length ? '<div class="empty">Todavía no hay tenidas registradas.</div>' : `
    <table class="resumen">
      <thead><tr><th>Hermano</th><th class="num">Presente</th><th class="num">C/ disculpa</th><th class="num">Sin aviso</th><th>% presente</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td>${esc(r.nombre)}</td>
          <td class="num">${r.presentes}</td>
          <td class="num">${r.disculpados}</td>
          <td class="num" style="${r.ausentes>0?'color:var(--rojo);font-weight:700;':''}">${r.ausentes}</td>
          <td>${r.total? r.pct+'%' : '—'}
            ${r.total?`<div class="bar-wrap"><div class="bar-fill" style="width:${r.pct}%;"></div></div>`:''}
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`}
  `;
  toolbar.style.display='flex';
  toolbar.innerHTML = `<button class="btn ghost" onclick="goAsistHome()">← Volver</button>`;
}

/* ---- Grilla anual ---- */
function renderAsistGrilla(main, toolbar){
  if(!state.asistRegistros.length){
    main.innerHTML = `<h2 class="section-title">Grilla anual</h2><div class="empty">Todavía no hay tenidas registradas.</div>`;
    toolbar.style.display='flex';
    toolbar.innerHTML = `<button class="btn ghost" onclick="goAsistHome()">← Volver</button>`;
    return;
  }
  const ordenados = [...state.asistRegistros].sort((a,b)=> a.fecha.localeCompare(b.fecha));
  const hh = state.config.hh;
  main.innerHTML = `
    <h2 class="section-title">Grilla anual</h2>
    <div class="grid-wrap">
      <table class="grilla">
        <thead><tr><th>Fecha</th>${hh.map(n=>`<th class="hh-col">${esc(n)}</th>`).join('')}</tr></thead>
        <tbody>
          ${ordenados.map(r=>`<tr>
            <td class="fecha-col">${r.fecha}<br><span class="muted">${esc(state.config.grados[r.grado].label)}</span></td>
            ${hh.map(n=>{
              const a = r.asistencia.find(x=>x.nombre===n);
              if(!a) return `<td>—</td>`;
              if(a.estado==='presente') return `<td class="p">P</td>`;
              if(a.estado==='disculpado') return `<td class="d">D</td>`;
              return `<td class="a">A</td>`;
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  toolbar.style.display='flex';
  toolbar.innerHTML = `<button class="btn ghost" onclick="goAsistHome()">← Volver</button>`;
}

  await db.auth.signOut();
