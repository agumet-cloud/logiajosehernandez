<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b14">
<title>Área reservada · Resp∴ Log∴ José Hernández N° 75</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>

<div style="min-height:100svh; display:flex; align-items:center; justify-content:center; padding:24px;">
  <div class="card" style="width:min(380px, 100%); padding:36px 32px;">
    <div class="kicker" style="text-align:center;">Resp∴ Log∴ José Hernández N° 75</div>
    <h1 style="text-align:center; font-size:1.7rem; margin:6px 0 28px;">Área reservada</h1>

    <form id="form-login">
      <div style="margin-bottom:16px;">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div style="margin-bottom:8px;">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="error-msg" id="error-msg"></div>
      <button class="primary" type="submit" id="btn-ingresar" style="margin-top:12px;">Ingresar</button>
    </form>

    <p class="muted" style="text-align:center; margin-top:24px; margin-bottom:0;">
      El acceso se otorga por invitación del Secretario.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js"></script>
<script>
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) window.location.href = "panel.html";
})();

const form = document.getElementById("form-login");
const errorMsg = document.getElementById("error-msg");
const btn = document.getElementById("btn-ingresar");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorMsg.textContent = "";
  btn.disabled = true;
  btn.textContent = "Ingresando…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    errorMsg.textContent = "Correo o contraseña incorrectos.";
    btn.disabled = false;
    btn.textContent = "Ingresar";
    return;
  }

  window.location.href = "panel.html";
});
</script>
</body>
</html>
