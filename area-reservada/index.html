<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b14">
<title>Área reservada · Resp∴ Log∴ José Hernández N° 75</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>

<div style="min-height:100svh; display:flex; align-items:center; justify-content:center; padding:24px;">
  <div class="card" style="width:min(380px, 100%); padding:36px 32px;">
    <div class="kicker" style="text-align:center;">Resp∴ Log∴ José Hernández N° 75</div>
    <h1 id="titulo" style="text-align:center; font-size:1.7rem; margin:6px 0 28px;">Área reservada</h1>

    <!-- Formulario normal: ingresar con correo y contraseña -->
    <form id="form-login">
      <div style="margin-bottom:16px;">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div style="margin-bottom:8px;">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="error-msg" id="error-msg"></div>
      <button class="primary" type="submit" id="btn-ingresar" style="margin-top:12px;">Ingresar</button>
    </form>

    <!-- Formulario de activación: primera vez que alguien acepta una invitación -->
    <form id="form-activar" style="display:none;">
      <p class="muted" style="margin-top:0;">Es la primera vez que entrás. Elegí tu contraseña para terminar de activar tu cuenta.</p>
      <div style="margin-bottom:16px;">
        <label for="password-nueva">Nueva contraseña</label>
        <input id="password-nueva" type="password" autocomplete="new-password" required minlength="8">
      </div>
      <div style="margin-bottom:8px;">
        <label for="password-repetir">Repetir contraseña</label>
        <input id="password-repetir" type="password" autocomplete="new-password" required minlength="8">
      </div>
      <div class="error-msg" id="error-msg-activar"></div>
      <button class="primary" type="submit" id="btn-activar" style="margin-top:12px;">Guardar contraseña e ingresar</button>
    </form>

    <p class="muted" style="text-align:center; margin-top:24px; margin-bottom:0;">
      El acceso se otorga por invitación del Secretario.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js"></script>
<script>
// Si el link con el que llegamos viene de una invitación (o de un
// "olvidé mi contraseña"), la URL trae type=invite o type=recovery
// en el fragmento (#). Lo leemos ANTES de que se pierda, para saber
// qué pantalla mostrar.
const hashParams = new URLSearchParams(window.location.hash.substring(1));
const esActivacion = hashParams.get("type") === "invite" || hashParams.get("type") === "recovery";

const formLogin = document.getElementById("form-login");
const formActivar = document.getElementById("form-activar");
const titulo = document.getElementById("titulo");

(async () => {
  const { data: { session } } = await db.auth.getSession();

  if (esActivacion && session) {
    // Recién aceptó la invitación: mostramos la pantalla de "elegí tu contraseña"
    titulo.textContent = "Activar cuenta";
    formLogin.style.display = "none";
    formActivar.style.display = "block";
    return;
  }

  if (session) {
    // Ya tenía sesión iniciada de antes
    window.location.href = "/area-reservada/panel.html";
  }
  // Si no hay sesión y no es activación, se queda en el login normal (ya visible)
})();

// --- Login normal ---
const errorMsg = document.getElementById("error-msg");
const btnIngresar = document.getElementById("btn-ingresar");

formLogin.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorMsg.textContent = "";
  btnIngresar.disabled = true;
  btnIngresar.textContent = "Ingresando…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      errorMsg.textContent = "Correo o contraseña incorrectos.";
      return;
    }

    window.location.href = "/area-reservada/panel.html";
  } catch (err) {
    console.error(err);
    errorMsg.textContent = "Hubo un error de conexión. Abrí la consola (F12) y avisale a soporte lo que dice ahí.";
  } finally {
    btnIngresar.disabled = false;
    btnIngresar.textContent = "Ingresar";
  }
});

// --- Activación de cuenta (primera contraseña) ---
const errorMsgActivar = document.getElementById("error-msg-activar");
const btnActivar = document.getElementById("btn-activar");

formActivar.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorMsgActivar.textContent = "";

  const nueva = document.getElementById("password-nueva").value;
  const repetir = document.getElementById("password-repetir").value;

  if (nueva !== repetir) {
    errorMsgActivar.textContent = "Las contraseñas no coinciden.";
    return;
  }
  if (nueva.length < 8) {
    errorMsgActivar.textContent = "La contraseña debe tener al menos 8 caracteres.";
    return;
  }

  btnActivar.disabled = true;
  btnActivar.textContent = "Guardando…";

  const { error } = await db.auth.updateUser({ password: nueva });

  if (error) {
    errorMsgActivar.textContent = "No se pudo guardar la contraseña. Probá de nuevo.";
    btnActivar.disabled = false;
    btnActivar.textContent = "Guardar contraseña e ingresar";
    return;
  }

  window.location.href = "/area-reservada/panel.html";
});
</script>
</body>
</html>
